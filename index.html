<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You Bei!</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #ff758c; overflow: hidden; color: white;
        }

        /* Overlay untuk memaksa izin audio */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.5s;
        }

        #start-btn {
            padding: 15px 40px; font-size: 1.5rem; background: white;
            color: #ff758c; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            font-weight: bold; animation: pulse 1.5s infinite;
        }

        /* Elemen Utama */
        .main-content { opacity: 0; transition: 2s; text-align: center; z-index: 10; }
        
        .heart-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .floating-heart {
            position: absolute; background: rgba(255, 255, 255, 0.4);
            width: 20px; height: 20px; transform: rotate(45deg);
            animation: float 8s infinite linear; border-radius: 0 0 5px 0;
        }
        .floating-heart::before, .floating-heart::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: inherit; border-radius: 50%;
        }
        .floating-heart::before { top: -50%; left: 0; }
        .floating-heart::after { left: -50%; top: 0; }

        .container {
            background: rgba(255, 255, 255, 0.15); padding: 50px;
            border-radius: 30px; backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h1 { font-size: 4rem; margin: 0; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        
        @keyframes float {
            0% { transform: translateY(110vh) rotate(45deg) scale(0.5); opacity: 0; }
            100% { transform: translateY(-10vh) rotate(45deg) scale(1.2); opacity: 0; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <p style="margin-bottom: 20px; font-size: 1.2rem;">Ada pesan untukmu, Bei...</p>
        <button id="start-btn" onclick="startEverything()">Buka Pesan ❤️</button>
    </div>

    <div class="heart-bg" id="heartContainer"></div>

    <div class="main-content" id="mainContent">
        <div class="container">
            <h1>Love You Bei!</h1>
            <p style="font-size: 1.5rem; margin-top: 15px;">Sudilah kau temani diriku...</p>
            <div id="youtube-player"></div>
            <p style="font-size: 0.9rem; margin-top: 30px; opacity: 0.7;">🎵 Now Playing: Payung Teduh - Akad</p>
        </div>
    </div>

    <script>
        var player;
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0',
                videoId: 'viW0M5R2BLo',
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0, 
                    'loop': 1, 
                    'playlist': 'viW0M5R2BLo',
                    'origin': window.location.origin 
                },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            // Player siap di background
        }

        function startEverything() {
            // Sembunyikan overlay & Tampilkan konten
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('mainContent').style.opacity = '1';
            }, 500);

            // Paksa musik berputar karena sudah ada interaksi klik
            if (player && player.playVideo) {
                player.playVideo();
                player.setVolume(100);
            }

            // Jalankan hujan hati
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const container = document.getElementById('heartContainer');
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
    </script>
</body>
</html>
